<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students · CityLibrary Admin</title>
<link href="vendor/fonts/fonts.css" rel="stylesheet">
<link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="students">

<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark"><i class="bi bi-bookshelf"></i></div>
      <div>CityLibrary<small>Admin Console</small></div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Overview</div>
      <a href="dashboard.html" class="nav-link" data-page="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <div class="sidebar-section-label">Catalog</div>
      <a href="books.html" class="nav-link" data-page="books"><i class="bi bi-journal-bookmark-fill"></i> Books</a>
      <a href="students.html" class="nav-link" data-page="students"><i class="bi bi-people-fill"></i> Students</a>
      <div class="sidebar-section-label">Circulation</div>
      <a href="issues.html" class="nav-link" data-page="issues"><i class="bi bi-arrow-left-right"></i> Issue &amp; Return</a>
      <div class="sidebar-section-label">Insights</div>
      <a href="reports.html" class="nav-link" data-page="reports"><i class="bi bi-bar-chart-line-fill"></i> Reports</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" data-user-initials>--</div>
        <div>
          <div class="name" data-user-name>—</div>
          <div class="role" data-user-role>—</div>
        </div>
        <button class="sidebar-logout-btn" data-action="logout" title="Log out"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="btn btn-outline-ink d-lg-none" data-action="toggle-sidebar"><i class="bi bi-list"></i></button>
      <div>
        <div class="topbar-title">Students</div>
        <div class="topbar-sub">Memberships, borrowing summary and fines</div>
      </div>
      <div class="topbar-right">
        <a href="reports.html?tab=overdue" class="topbar-icon-btn" title="Overdue books">
          <i class="bi bi-bell"></i><span class="dot" data-late-count style="display:none;"></span>
        </a>
        <button class="btn btn-brass" id="btnAddStudent"><i class="bi bi-person-plus"></i> Add Student</button>
      </div>
    </header>

    <main class="page-content">
      <div class="panel">
        <div class="table-toolbar">
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control" id="searchInput" placeholder="Search by name or roll number…">
          </div>
          <select class="form-select" id="statusFilter">
            <option value="">All statuses</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="blocked">Blocked</option>
          </select>
          <select class="form-select ms-auto" id="pageSize" style="max-width:110px;">
            <option value="10">10 / page</option>
            <option value="25">25 / page</option>
            <option value="50">50 / page</option>
          </select>
        </div>

        <div class="table-shell" style="border:none; border-radius:0;">
          <table class="table">
            <thead>
              <tr>
                <th>Student</th>
                <th>Department</th>
                <th>Currently Holding</th>
                <th>Overdue</th>
                <th>Fine Balance</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="studentsTableBody">
              <tr class="skeleton-row"><td colspan="7"><div class="skeleton-bar"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination-bar" id="paginationBar"></div>
      </div>
    </main>
  </div>
</div>

<!-- Add / Edit Student Modal -->
<div class="modal fade" id="studentModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="studentModalTitle">Add Student</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="studentForm">
        <div class="modal-body">
          <input type="hidden" id="studentId">
          <div class="row">
            <div class="col-md-6 field-group">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="fFullName" required>
            </div>
            <div class="col-md-6 field-group">
              <label class="form-label">Roll Number *</label>
              <input type="text" class="form-control" id="fRollNumber" required placeholder="BBD-CS-2201">
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 field-group">
              <label class="form-label">Email *</label>
              <input type="email" class="form-control" id="fEmail" required>
            </div>
            <div class="col-md-6 field-group">
              <label class="form-label">Phone *</label>
              <input type="text" class="form-control" id="fPhone" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 field-group">
              <label class="form-label">Department</label>
              <input type="text" class="form-control" id="fDepartment" placeholder="Computer Science">
            </div>
            <div class="col-md-3 field-group">
              <label class="form-label">Semester</label>
              <input type="number" class="form-control" id="fSemester" min="1" max="12">
            </div>
            <div class="col-md-3 field-group" id="statusFieldGroup" style="display:none;">
              <label class="form-label">Status</label>
              <select class="form-select" id="fStatus">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="blocked">Blocked</option>
              </select>
            </div>
          </div>
          <div class="field-group">
            <label class="form-label">Address</label>
            <textarea class="form-control" id="fAddress" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-ink" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brass" id="studentSaveBtn">Save Student</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/students.js"></script>
</body>
</html>
